services:
  # 1. Banco de Dados Principal
  db:
    image: postgres:15-alpine
    container_name: cobranca_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: cobranca_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis (Cache e Session Store)
  redis:
    image: redis:7-alpine
    container_name: cobranca_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. RabbitMQ (Message Broker)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cobranca_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    ports:
      - "5672:5672"   # Porta padrão do protocolo AMQP
      - "15672:15672" # Porta do painel de administração web (Dashboard)

  # 4. FastAPI Backend
  api:
    build: .
    container_name: cobranca_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/cobranca_db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER must be set}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}@rabbitmq:5672//
    depends_on:
      - db
      - redis
      - rabbitmq

# Declaração dos volumes para persistência de dados
volumes:
  postgres_data: