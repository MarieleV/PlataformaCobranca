# Sobrepõe o docker-compose de desenvolvimento para o teste de carga: a API roda
# como em produção (deploy/docker-compose.prod.yml), com 2 processos e sem --reload.
# O --reload de desenvolvimento usa um processo só e vigia arquivos, o que distorce
# a medição do RNF02.
#
# Uso (na pasta back-end):
#   docker compose -f docker-compose.yml -f ../carga/docker-compose.carga.yml up -d
# Para voltar ao modo de desenvolvimento:
#   docker compose up -d
services:
  api:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
