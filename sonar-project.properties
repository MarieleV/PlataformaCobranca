# Organização no SonarCloud
sonar.organization=marielev

# A chave do projeto (Project Key)
sonar.projectKey=MarieleV_PlataformaCobranca
sonar.sourceEncoding=UTF-8

# Código-fonte analisado e testes (os testes ficam fora das métricas de bugs/duplicação)
sonar.sources=back-end/app
sonar.tests=back-end/tests

# Arquivos que não entram na análise (o seed só roda uma vez, na instalação)
sonar.exclusions=back-end/app/seed.py

# Python e cobertura (gerada pelo pytest-cov no CI: back-end/coverage.xml)
sonar.python.version=3.14
sonar.python.coverage.reportPaths=back-end/coverage.xml
