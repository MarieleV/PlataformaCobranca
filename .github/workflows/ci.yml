# CI/CD da Plataforma de Cobrança Automatizada (RNF06 e RNF07)
#
#  testes + SonarCloud ─┐
#  migrações (Postgres) ─┤
#  build do Docker ─────┼─> deploy (só na main, e só se tudo acima passar):
#  front-end ───────────┘   imagens no GHCR + SSH na EC2 (docker compose up)
#
# RNF06: cobertura mínima de 80% (o pytest e o Vitest falham abaixo disso).
# RNF07: se um teste falhar ou o Quality Gate do SonarCloud reprovar, o job
#        fica vermelho e o deploy não roda.
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

# Cancela execuções antigas da mesma branch quando chega um push novo.
# Na main não cancela: um deploy pela metade é pior do que esperar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14" # a mesma do Dockerfile
  NODE_VERSION: "22" # LTS indicada no front-end/README.md

jobs:
  testes-e-qualidade:
    name: Testes e SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # o SonarCloud precisa do histórico completo

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: back-end/requirements*.txt

      - name: Instalar dependências
        working-directory: back-end
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rodar testes (cobertura mínima de 80%)
        working-directory: back-end
        run: pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=80

      # O plano gratuito do SonarCloud só informa o Quality Gate da branch
      # principal (main) e de pull requests; nas demais branches rodam só os testes.
      # PRs do Dependabot não recebem os segredos do repositório (SONAR_TOKEN),
      # então pulam a análise; os testes rodam normalmente.
      - name: Análise do SonarCloud e Quality Gate
        if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # espera o resultado do Quality Gate; se reprovar, este passo falha
          args: -Dsonar.qualitygate.wait=true

  migracoes:
    name: Migrações no PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cobranca_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cobranca_ci
      JWT_SECRET: chave-apenas-para-o-ci-com-mais-de-32-caracteres
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: back-end/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Aplicar todas as migrações
        run: alembic upgrade head
      - name: Os modelos e as migrações estão em sincronia?
        run: alembic check
      - name: Desfazer e refazer a última migração
        run: |
          alembic downgrade -1
          alembic upgrade head

  build-docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir a imagem da API
        run: docker build --tag cobranca-api:ci back-end
      - name: Construir a imagem do front-end (Vite + Caddy)
        run: docker build --tag cobranca-web:ci front-end
      - name: O Caddyfile é válido?
        run: docker run --rm cobranca-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: O docker-compose de produção é válido?
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^RABBITMQ_PASSWORD=$/RABBITMQ_PASSWORD=ci/' .env
          docker compose -f docker-compose.prod.yml config --quiet

  front-end:
    name: Front-end (lint, tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: Instalar dependências (versões exatas do package-lock)
        run: npm ci
      - name: Lint (ESLint, sem avisos)
        run: npm run lint
      - name: Checagem de tipos (TypeScript)
        run: npm run typecheck
      - name: Testes (cobertura mínima de 80%)
        run: npm run test:coverage
      - name: Build de produção
        run: npm run build

  deploy:
    name: Deploy
    # RNF07: só roda se os quatro jobs acima passaram, e apenas na main
    needs: [testes-e-qualidade, migracoes, build-docker, front-end]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: producao # segredos do deploy ficam neste ambiente (Settings > Environments)
      url: https://${{ vars.DOMINIO }}
    permissions:
      contents: read
      packages: write # publicar as imagens no GitHub Container Registry
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Nome do registro (o GHCR exige minúsculas)
        run: echo "REGISTRO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login no GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build e push das imagens (tag = commit e latest)
        run: |
          for servico in api:back-end web:front-end; do
            nome="${servico%%:*}"; pasta="${servico#*:}"
            imagem="$REGISTRO/cobranca-$nome"
            docker build \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --tag "$imagem:$IMAGE_TAG" --tag "$imagem:latest" "$pasta"
            docker push "$imagem:$IMAGE_TAG"
            docker push "$imagem:latest"
          done

      # Segredos via variáveis de ambiente (nunca interpolados direto no script)
      - name: Configurar o SSH da EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USUARIO: ${{ secrets.EC2_USUARIO }}
          EC2_CHAVE_SSH: ${{ secrets.EC2_CHAVE_SSH }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_CHAVE_SSH" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host ec2\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/ec2\n  StrictHostKeyChecking yes\n' \
            "$EC2_HOST" "$EC2_USUARIO" > ~/.ssh/config

      # Sobe as imagens do commit atual. Para voltar a uma versão anterior, na EC2:
      #   cd ~/cobranca && IMAGE_TAG=<sha antigo> docker compose up -d
      - name: Atualizar os containers na EC2
        run: |
          scp deploy/docker-compose.prod.yml ec2:cobranca/docker-compose.yml
          # REGISTRO e IMAGE_TAG são expandidos aqui no runner, de propósito
          # shellcheck disable=SC2029
          ssh ec2 "cd cobranca \
            && export REGISTRO=$REGISTRO IMAGE_TAG=$IMAGE_TAG \
            && docker compose pull --quiet \
            && docker compose up -d --remove-orphans --wait --wait-timeout 300 \
            && docker image prune -f"

      - name: Teste de fumaça (HTTPS + /health)
        env:
          DOMINIO: ${{ vars.DOMINIO }}
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors \
            "https://$DOMINIO/health"
