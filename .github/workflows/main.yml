name: CI/CD Pipeline - Plataforma de Cobrança

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-analyze:
    name: Test and SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Obrigatório para o SonarCloud analisar o histórico

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r back-end/requirements.txt
          pip install pytest pytest-cov

      - name: Executar Testes (Pytest)
        run: |
          # Na Fase 2, quando criarmos os testes, este comando vai gerar o relatório de cobertura de 80% exigido no RFC
          echo "Executando testes..."
          # pytest back-end/app/tests/ --cov=back-end/app --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}