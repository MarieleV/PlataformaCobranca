# Atualização automática de dependências (pendência do RFC 8.3).
# Os PRs vão para a develop (git-flow) e passam pelo mesmo CI dos PRs normais.
# Mensal e agrupado por ecossistema, para não encher a fila de PRs.
#
# Versões maiores (major) ficam de fora em pip, npm e Docker: costumam quebrar
# compatibilidade (ex.: TypeScript 7 é recusado pelo typescript-eslint 8, e o
# Node do Dockerfile precisa ser o mesmo do CI, a LTS 22). Elas são feitas à
# mão, numa feature/*, quando fizer sentido. O Dependabot lê este arquivo da
# branch padrão (main): a mudança só vale depois de chegar lá.
version: 2
updates:
  - package-ecosystem: pip
    directory: /back-end
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # O Celery 5.7 fixa python-dateutil==2.9.0.post0 e o projeto usa a 3.0.0:
      # o pip não instala os dois juntos. Rever quando sair uma versão sem essa trava.
      - dependency-name: celery
        versions: [">=5.7.0"]
    groups:
      back-end:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /front-end
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      front-end:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/back-end, /front-end]
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
